# ultimatemove.co.uk — host nginx (/etc/nginx/conf.d/umet.conf)
#
# Search discoverability: published Tek Juice articles are served
# pre-rendered by the backend (tekjuice-connector SeoPages) and
# /sitemap.xml is generated from published content. Anything that is not a
# published article, and any backend failure, falls back to the app's
# index.html exactly as before.
#
# AI answer engines: /robots.txt (welcomes AI crawlers), /llms.txt,
# /llms-full.txt, /feed.json, /entity.json (verified business facts) and a
# Markdown copy of every article at
# /<slug>.md, all naming the article's canonical URL on this domain.
#
# Not found: an address that is neither a file, a published article nor one
# of the app's own routes gets the app's page (which shows "not found") with
# HTTP 404, so search engines drop removed pages instead of seeing the home
# page as a "soft 404". If the backend is unavailable, the app is served as
# before (200).

# The app's private (login-only) routes: crawlable, but never indexed. On the
# original request URI, because app routes are served by an internal
# redirect to /index.html. An empty value sends no header.
map $request_uri $umet_robots_header {
    default "";
    ~^/(dashboard|expenses|income|budgets|categories|analytics|profile|login|register|forgot-password)(/|\?|$) "noindex, nofollow";
}

# The app's own routes (src/routes/AppRoutes.tsx); keep in step with it.
map $uri $umet_app_route {
    default 0;
    ~^/(home|features|pricing|about|resources|login|register|forgot-password|dashboard|expenses|income|budgets|categories|analytics|profile)/?$ 1;
    ~^/expenses/[^/]+/?$ 1;
    / 1;
    /index.html 1;
}

server {
    listen 80;
    server_name ultimatemove.co.uk www.ultimatemove.co.uk;
    return 301 https://ultimatemove.co.uk$request_uri;
}

server {
    listen 443 ssl;
    server_name www.ultimatemove.co.uk;
    ssl_certificate /etc/letsencrypt/live/ultimatemove.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ultimatemove.co.uk/privkey.pem;
    return 301 https://ultimatemove.co.uk$request_uri;
}

server {
    listen 443 ssl;
    server_name ultimatemove.co.uk;
    ssl_certificate /etc/letsencrypt/live/ultimatemove.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ultimatemove.co.uk/privkey.pem;

    root /home/ec2-user/umet-frontend/umet-frontend/dist;
    index index.html;

    add_header X-Robots-Tag $umet_robots_header always;

    # Sitemap generated from published content (static file if unavailable).
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:9700/api/integrations/tekjuice/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @static_file;
    }

    # robots.txt from the backend (static file if unavailable).
    location = /robots.txt {
        proxy_pass http://127.0.0.1:9700/api/integrations/tekjuice/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @static_file;
    }

    # AI-readable site index, full text and feed (404 if unavailable).
    location ~ ^/(llms\.txt|llms-full\.txt|feed\.json|entity\.json)$ {
        proxy_pass http://127.0.0.1:9700/api/integrations/tekjuice/seo/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }

    # Markdown copy of an article: /<slug>.md
    location ~ ^/([A-Za-z0-9_-]+)\.md$ {
        proxy_pass http://127.0.0.1:9700/api/integrations/tekjuice/seo/markdown/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # IndexNow key file (/<32 hex>.txt): lets the Data Engine notify Bing,
    # Yandex and other IndexNow engines the moment an article is live.
    location ~ "^/([a-f0-9]{32})\.txt$" {
        proxy_pass http://127.0.0.1:9700/api/integrations/tekjuice/seo/indexnow/$1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Static files first; otherwise a pre-rendered article; otherwise the app.
    location / {
        try_files $uri @tekjuice_page;
    }

    location @tekjuice_page {
        proxy_pass http://127.0.0.1:9700/api/integrations/tekjuice/seo/page$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 404 = @app_route;
        error_page 500 502 503 504 = /index.html;
    }

    # Not a published article: an app route gets the app (200); anything
    # else gets the app's not-found page with status 404.
    location @app_route {
        error_page 404 /index.html;
        error_page 418 = /index.html;
        if ($umet_app_route) {
            return 418;
        }
        return 404;
    }

    location @static_file {
        try_files $uri =404;
    }

    location /api/v1/ {
        proxy_pass http://localhost:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://localhost:9700/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
