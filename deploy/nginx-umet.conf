# ultimatemove.co.uk — host nginx (/etc/nginx/conf.d/umet.conf)
#
# Search discoverability: published Tek Juice articles are served
# pre-rendered by the backend (tekjuice-connector SeoPages) and
# /sitemap.xml is generated from published content. Anything that is not a
# published article, and any backend failure, falls back to the app's
# index.html exactly as before.

server {
    listen 80;
    server_name ultimatemove.co.uk www.ultimatemove.co.uk;
    return 301 https://ultimatemove.co.uk$request_uri;
}

server {
    listen 443 ssl;
    server_name www.ultimatemove.co.uk;
    ssl_certificate /etc/letsencrypt/live/ultimatemove.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ultimatemove.co.uk/privkey.pem;
    return 301 https://ultimatemove.co.uk$request_uri;
}

server {
    listen 443 ssl;
    server_name ultimatemove.co.uk;
    ssl_certificate /etc/letsencrypt/live/ultimatemove.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ultimatemove.co.uk/privkey.pem;

    root /home/ec2-user/umet-frontend/umet-frontend/dist;
    index index.html;

    # Sitemap generated from published content (static file if unavailable).
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:9700/api/integrations/tekjuice/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @static_file;
    }

    # Static files first; otherwise a pre-rendered article; otherwise the app.
    location / {
        try_files $uri @tekjuice_page;
    }

    location @tekjuice_page {
        proxy_pass http://127.0.0.1:9700/api/integrations/tekjuice/seo/page$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = /index.html;
    }

    location @static_file {
        try_files $uri =404;
    }

    location /api/v1/ {
        proxy_pass http://localhost:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://localhost:9700/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
